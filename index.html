<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101112">
  <meta name="color-scheme" content="dark">
  <title>Paul</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="identity">
    <h1>Paul<span>.</span></h1>
    <svg class="alien" viewBox="0 0 100 85" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <defs>
        <filter id="paul-soft-glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="180" height="165" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="paul-tight-glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="180" height="165" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.5"/></filter>
        <g id="paul-lines">
      <path d="M30 18 23 8m47 10 7-10M24 8l-3-3m56 3 3-3M50 15C24 12 12 28 19 46c5 15 22 29 31 31 9-2 26-17 31-31C89 27 75 12 50 15Z"/>
      <path d="M28 34c13-1 17 7 17 17-11 1-18-6-17-17Zm44 0c-13-1-17 7-17 17 11 1 18-6 17-17ZM43 62q7 5 14-1"/>
      <path d="m12 58-5 4m78-42 6-3" opacity=".5"/>
        </g>
      </defs>
      <g id="paul-glow" opacity="0">
        <use href="#paul-lines" stroke="#00ff32" stroke-width="5" filter="url(#paul-soft-glow)"/>
        <use href="#paul-lines" stroke="#39ff14" stroke-width="4" filter="url(#paul-tight-glow)"/>
      </g>
      <use id="paul-outline" href="#paul-lines"/>
    </svg>
  </header>
  <main>
    <section class="lab" aria-label="Stimmenlabor">
      <div class="wave-panel">
        <canvas id="wave" aria-label="Wellenform deiner Stimme"></canvas>
        <div class="wave-meta"><span class="signal-light" aria-hidden="true"></span><time id="timer">0:00 / 1:00</time></div>
      </div>
      <div class="transport" role="group" aria-label="Aufnahme und Wiedergabe">
        <button id="record" class="transport-button record" aria-label="Aufnahme starten" title="Aufnahme starten"><span class="record-icon" aria-hidden="true"></span></button>
        <button id="forward" class="transport-button forward" aria-label="Vorwärts abspielen" title="Vorwärts abspielen" aria-pressed="false" disabled><svg class="play-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 7 40 24 14 41Z"/></svg><span class="stop-icon" aria-hidden="true"></span></button>
        <button id="reverse" class="transport-button reverse" aria-label="Rückwärts abspielen" title="Rückwärts abspielen" aria-pressed="false" disabled><svg class="play-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M34 7 8 24 34 41Z"/></svg><span class="stop-icon" aria-hidden="true"></span></button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <fieldset id="controls" disabled>
        <legend class="sr-only">Stimme verändern</legend>
        <div class="effect-heading"><label for="pitch">Pitch</label><output id="pitch-value" for="pitch">Normal</output><button id="reset" aria-label="Alle Effekte zurücksetzen" title="Alle Effekte zurücksetzen" disabled>↺</button></div>
        <input id="pitch" type="range" min="-12" max="12" step="1" value="0">
        <div class="extra-effect">
          <div class="effect-heading"><label for="hall-amount">Hall</label><output id="hall-value" for="hall-amount">Aus</output></div>
          <input id="hall-amount" type="range" min="0" max="200" step="1" value="0">
        </div>
        <div class="extra-effect">
          <div class="effect-heading"><label for="distortion-amount">Verzerrung</label><output id="distortion-value" for="distortion-amount">Aus</output></div>
          <input id="distortion-amount" type="range" min="0" max="200" step="1" value="0">
        </div>
      </fieldset>
    </section>
  </main>
</body>
</html>
